# =============================================================================
# Varsha — Advisory Rules (expert system)
# Based on ICAR-CRIDA District Agriculture Contingency Plans for Telangana.
# These are DETERMINISTIC rules evaluated in priority order. Probabilities come
# from the hybrid forecast; seedling survival comes from the analog ensemble +
# FAO-56 water balance. An LLM/MT engine may only rephrase text, never decide.
#
# Telugu and Hindi texts were drafted for the prototype and must be reviewed
# by a native-speaking agronomist (KVK / PJTSAU) before field use.
# =============================================================================

# --- Cost-loss decision framework ---
# Sowing now risks losing seed + sowing cost (L) if seedlings fail; waiting
# costs some yield (C). Sow only if P(seedling failure) < C/L, i.e.
#   seedling_survival_probability > 1 - cost_loss_ratio
decision_framework:
  default_cost_loss_ratio: 0.35
  overrides:
    cotton: 0.30       # expensive Bt seed -> lower tolerance for failure
    soybean: 0.35
    groundnut: 0.30    # costly seed, very sensitive to false onset
    paddy: 0.40        # nursery is cheap to redo; transplanting comes later

# --- Rule thresholds (evaluated in this order) ---
rules:
  very_heavy_alert:           # any crop, any stage
    action: ALERT
    priority: 1
    very_heavy_rain_probability_7d_min: 0.30
  switch_crop:                # not sown and the sowing window has closed or onset is very late
    action: SWITCH
    priority: 2
    days_after_latest_sowing: 0
    late_onset_doy: 196       # after July 15 with no established onset
    onset_probability_14d_max: 0.40
  resow_alert:                # sown, seedlings exposed to a long break
    action: RESOW_ALERT
    priority: 2
    stages: [initial]
    dry_spell_probability_14d_min: 0.50
  sow_go:                     # not sown, inside the window, onset signal present, and:
    action: SOW
    priority: 3
    onset_probability_7d_min: 0.70        # ... or onset already provisional/established
    min_soil_moisture: 0.20               # enough moisture in the root zone to sow
    min_rain_last_14d_mm: 50              # ICAR-CRIDA: sow only after ~50 mm of cumulative rain
    false_onset_given_onset_max: 0.95     # veto only when the rains are almost certain to fail;
                                          # otherwise seedling survival (water balance) decides
    # plus: P(seedling survival | sow today) > 1 - cost_loss_ratio (decision_framework)
  sow_wait:                   # onset signal present but survival / soil / false-onset checks fail
    action: WAIT
    priority: 3
    wait_days: 7
  protect:
    action: PROTECT
    priority: 3
    stages: [initial, development]
    dry_spell_probability_7d_min: 0.60
  irrigate:
    action: IRRIGATE
    priority: 3
    stages: [development, mid_season]
    max_soil_moisture: 0.35
    dry_spell_probability_7d_min: 0.50
  heavy_prepare:
    action: PREPARE
    priority: 4
    heavy_rain_probability_7d_min: 0.50
  break_conserve:
    action: CONSERVE
    priority: 4
    dry_spell_probability_14d_min: 0.60
    anomaly_vs_climatology_min: 0.12      # break risk must be clearly above normal for the date
  pre_season:
    action: WAIT
    priority: 5
    days_before_earliest_sowing: 3
  await_onset:
    action: WAIT
    priority: 5
  normal:
    action: NORMAL
    priority: 6

# --- Alternative crops when switching / resowing ---
crop_alternatives:
  cotton: ["short-duration pigeon pea", "castor"]
  soybean: ["green gram (moong)", "black gram (urad)"]
  groundnut: ["sunflower", "sesame"]
  paddy: ["direct-seeded rice", "finger millet"]

