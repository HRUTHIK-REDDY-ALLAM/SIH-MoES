  hi: [जनवरी, फ़रवरी, मार्च, अप्रैल, मई, जून, जुलाई, अगस्त, सितंबर, अक्टूबर, नवंबर, दिसंबर]

# --- Full advisory texts per rule ---
messages:
  sow_go:
    en: "Monsoon has set in and the coming weeks look favourable. This is a good time to sow {crop}. Chance that seedlings survive if sown now: {survival}%."
    te: "రుతుపవనాలు ప్రారంభమయ్యాయి, రాబోయే వారాలు అనుకూలంగా ఉన్నాయి. {crop} విత్తడానికి ఇది మంచి సమయం. ఇప్పుడు విత్తితే మొలకలు బతికే అవకాశం: {survival}%."
    hi: "मानसून आ गया है और आने वाले हफ्ते अनुकूल दिख रहे हैं। {crop} की बुवाई का यह अच्छा समय है। अभी बोने पर पौध बचने की संभावना: {survival}%।"
  sow_wait:
    en: "Rain has started but a dry spell of 7+ days is likely within 2 weeks (chance {p_dry_2w}%). Wait about {wait_days} more days before sowing {crop}. If sown now, seedling survival chance is only {survival}%."
    te: "వర్షాలు మొదలయ్యాయి కానీ 2 వారాల్లో 7+ రోజుల పొడి వాతావరణం వచ్చే అవకాశం ఉంది ({p_dry_2w}%). {crop} విత్తడానికి మరో {wait_days} రోజులు ఆగండి. ఇప్పుడు విత్తితే మొలకలు బతికే అవకాశం {survival}% మాత్రమే."
    hi: "बारिश शुरू हो गई है, लेकिन 2 हफ्तों में 7+ दिन सूखा पड़ने की संभावना है ({p_dry_2w}%)। {crop} की बुवाई से पहले लगभग {wait_days} दिन और रुकें। अभी बोने पर पौध बचने की संभावना केवल {survival}% है।"
  await_onset:
    en: "Monsoon has not set in yet in your area (chance of onset in the next 7 days: {p_onset}%). Do not sow {crop} yet. Sow only after at least 20 mm of rain over 2-3 days."
    te: "మీ ప్రాంతంలో రుతుపవనాలు ఇంకా ప్రారంభం కాలేదు (రాబోయే 7 రోజుల్లో ప్రారంభం అవకాశం: {p_onset}%). {crop} ఇప్పుడే విత్తవద్దు. 2-3 రోజుల్లో కనీసం 20 మి.మీ. వర్షం పడిన తర్వాతే విత్తండి."
    hi: "आपके क्षेत्र में अभी मानसून शुरू नहीं हुआ है (अगले 7 दिनों में शुरुआत की संभावना: {p_onset}%)। अभी {crop} की बुवाई न करें। 2-3 दिनों में कम से कम 20 मिमी बारिश के बाद ही बुवाई करें।"
  pre_season:
    en: "The sowing window for {crop} opens around {window_start}. Prepare the land and keep quality seed ready. Do not sow on pre-monsoon showers."
    te: "{crop} విత్తే సమయం సుమారు {window_start} నుండి మొదలవుతుంది. పొలం సిద్ధం చేసుకోండి, మంచి విత్తనాలు దగ్గర ఉంచుకోండి. తొలకరి జల్లులకే విత్తవద్దు."
    hi: "{crop} की बुवाई का समय लगभग {window_start} से शुरू होगा। खेत तैयार रखें और अच्छे बीज तैयार रखें। मानसून-पूर्व बौछारों पर बुवाई न करें।"
  switch_crop:
    en: "The sowing window for {crop} has closed or the monsoon is badly delayed. Switch to a short-duration crop such as {alternative_crop}."
    te: "{crop} విత్తే సమయం దాటిపోయింది లేదా రుతుపవనాలు చాలా ఆలస్యం అయ్యాయి. {alternative_crop} వంటి తక్కువ కాలపు పంటకు మారండి."
    hi: "{crop} की बुवाई का समय निकल गया है या मानसून बहुत देर से है। {alternative_crop} जैसी कम अवधि की फसल लगाएं।"
  resow_alert:
    en: "A long dry spell (14+ days) is likely (chance {p_dry14}%). Young {crop} seedlings may die. Keep seed of {alternative_crop} ready to resow when rain returns."
    te: "సుదీర్ఘ పొడి వాతావరణం (14+ రోజులు) వచ్చే అవకాశం ఉంది ({p_dry14}%). చిన్న {crop} మొలకలు ఎండిపోవచ్చు. వర్షం తిరిగి రాగానే మళ్ళీ విత్తడానికి {alternative_crop} విత్తనాలు సిద్ధంగా ఉంచుకోండి."
    hi: "लंबा सूखा (14+ दिन) पड़ने की संभावना है ({p_dry14}%)। {crop} के छोटे पौधे सूख सकते हैं। बारिश लौटने पर दोबारा बुवाई के लिए {alternative_crop} के बीज तैयार रखें।"
  protect:
    en: "A dry spell of 7+ days is likely this week (chance {p_dry}%) while {crop} is at a sensitive stage. Do inter-cultivation or mulching to save soil moisture and postpone fertiliser."
    te: "ఈ వారం 7+ రోజుల పొడి వాతావరణం వచ్చే అవకాశం ఉంది ({p_dry}%). {crop} సున్నిత దశలో ఉంది. నేల తేమను కాపాడేందుకు అంతర కృషి లేదా మల్చింగ్ చేయండి, ఎరువులు వాయిదా వేయండి."
    hi: "इस हफ्ते 7+ दिन सूखा पड़ने की संभावना है ({p_dry}%) और {crop} संवेदनशील अवस्था में है। नमी बचाने के लिए निराई-गुड़ाई या मल्चिंग करें और उर्वरक देना टालें।"
  irrigate:
    en: "Soil moisture is low and little rain is expected (dry-spell chance {p_dry}%). Give a protective irrigation to {crop} from a farm pond or borewell if available."
    te: "నేలలో తేమ తక్కువగా ఉంది, వర్షం తక్కువగా పడే అవకాశం ఉంది (పొడి వాతావరణం అవకాశం {p_dry}%). అందుబాటులో ఉంటే ఫారం పాండ్ లేదా బోరు నుండి {crop}కు రక్షణ తడి ఇవ్వండి."
    hi: "मिट्टी में नमी कम है और बारिश कम होने की संभावना है (सूखे की संभावना {p_dry}%)। उपलब्ध हो तो खेत तालाब या बोरवेल से {crop} में जीवन-रक्षक सिंचाई करें।"
  break_conserve:
    en: "A monsoon break is likely to start within {days_ahead} days, with little rain for 1-2 weeks. Conserve soil moisture and delay top-dressing of fertiliser for {crop}."
    te: "{days_ahead} రోజుల్లో రుతుపవనాల విరామం మొదలయ్యే అవకాశం ఉంది, 1-2 వారాలు వర్షం తక్కువగా ఉంటుంది. నేల తేమను కాపాడండి, {crop}కు పై ఎరువు వేయడం వాయిదా వేయండి."
    hi: "{days_ahead} दिनों में मानसून में विराम शुरू होने की संभावना है, 1-2 हफ्ते बारिश कम रहेगी। मिट्टी की नमी बचाएं और {crop} में ऊपरी खाद देना टालें।"
  heavy_prepare:
    en: "Heavy rain (65+ mm in a day) is likely in the next 7 days (chance {p_heavy}%). Clear field drains, avoid spraying and fertiliser application, and keep harvested produce covered."
    te: "రాబోయే 7 రోజుల్లో భారీ వర్షం (ఒక రోజులో 65+ మి.మీ.) పడే అవకాశం ఉంది ({p_heavy}%). పొలంలో నీరు బయటకు పోయే కాలువలు శుభ్రం చేయండి, పురుగుమందు పిచికారీ మరియు ఎరువులు వేయడం ఆపండి."
    hi: "अगले 7 दिनों में भारी बारिश (एक दिन में 65+ मिमी) की संभावना है ({p_heavy}%)। खेत की नालियां साफ करें, छिड़काव और खाद डालना टालें, कटी फसल ढककर रखें।"
  very_heavy_alert:
    en: "VERY HEAVY RAIN WARNING: 115+ mm in a day is possible in the next 7 days (chance {p_vheavy}%). Risk of waterlogging and crop damage. Drain fields and move produce and animals to safety."
    te: "అతి భారీ వర్ష హెచ్చరిక: రాబోయే 7 రోజుల్లో ఒక రోజులో 115+ మి.మీ. వర్షం పడే అవకాశం ఉంది ({p_vheavy}%). పొలాల్లో నీరు నిలిచి పంట నష్టం జరగవచ్చు. నీటిని బయటకు పంపండి, పంట ఉత్పత్తులు మరియు పశువులను సురక్షిత ప్రాంతానికి తరలించండి."
    hi: "अति भारी वर्षा चेतावनी: अगले 7 दिनों में एक दिन में 115+ मिमी बारिश संभव है ({p_vheavy}%)। जलभराव और फसल नुकसान का खतरा। खेतों से पानी निकालें और उपज व पशुओं को सुरक्षित स्थान पर ले जाएं।"
  normal:
    en: "The rainfall outlook is normal for {crop}. Continue planned field operations."
    te: "{crop}కు వర్షపాత సూచన సాధారణంగా ఉంది. ప్రణాళిక ప్రకారం పొలం పనులు కొనసాగించండి."
    hi: "{crop} के लिए वर्षा का पूर्वानुमान सामान्य है। योजना के अनुसार खेती के काम जारी रखें।"

# --- Forecast summary line appended to every advisory ---
outlook:
  en: "Next 7 days: about {rain_7d} mm of rain expected; dry-spell chance {p_dry}%, heavy-rain chance {p_heavy}%. Forecast confidence: {confidence}."
  te: "రాబోయే 7 రోజులు: సుమారు {rain_7d} మి.మీ. వర్షం; పొడి వాతావరణం అవకాశం {p_dry}%, భారీ వర్షం అవకాశం {p_heavy}%. సూచన నమ్మకం: {confidence}."
  hi: "अगले 7 दिन: लगभग {rain_7d} मिमी बारिश; सूखे की संभावना {p_dry}%, भारी बारिश की संभावना {p_heavy}%। पूर्वानुमान पर भरोसा: {confidence}।"

# --- SMS (kept short; Telugu/Hindi SMS are Unicode = 70 chars per segment) ---
sms:
  en: "Varsha {panchayat}: {crop} - {action_word}. 7d: rain {rain_7d}mm, dry {p_dry}%, heavy {p_heavy}%. Reply 1=rained today, 2=no rain"
  te: "వర్ష {panchayat}: {crop} - {action_word}. 7 రోజులు: వర్షం {rain_7d}మి.మీ, పొడి {p_dry}%, భారీ {p_heavy}%. ఈరోజు వర్షం పడితే 1, లేకపోతే 2 పంపండి"
  hi: "वर्षा {panchayat}: {crop} - {action_word}। 7 दिन: बारिश {rain_7d}मिमी, सूखा {p_dry}%, भारी {p_heavy}%। आज बारिश हुई तो 1, नहीं तो 2 भेजें"

# --- Confidence display rules (Brier Skill Score vs climatology) ---
confidence:
  high:
    min_bss: 0.20
    display_color: "#2ecc71"
    label_en: "High confidence"
  moderate:
    min_bss: 0.05
    display_color: "#f39c12"
    label_en: "Moderate confidence"
  low:
    min_bss: -999
    display_color: "#e74c3c"
    label_en: "Low confidence — treat as general guidance only"
