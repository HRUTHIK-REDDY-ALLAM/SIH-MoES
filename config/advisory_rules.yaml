  ALERT:       {en: "VERY HEAVY RAIN ALERT", te: "అతి భారీ వర్ష హెచ్చరిక", hi: "अति भारी वर्षा चेतावनी"}
  RESOW_ALERT: {en: "RESOWING MAY BE NEEDED", te: "మళ్ళీ విత్తాల్సి రావచ్చు", hi: "दोबारा बुवाई करनी पड़ सकती है"}
